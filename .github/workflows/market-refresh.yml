# Refreshes the daily market data. Works with any host: add two repository secrets,
#   MARKET_CRON_URL  e.g. https://your-site.example/api/cron/market
#   CRON_SECRET      the same value as the CRON_SECRET environment variable on the site
# If you host on Vercel you can use its own Cron instead and delete this file.
name: Refresh market data
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call the refresh endpoint
        env:
          URL: ${{ secrets.MARKET_CRON_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then echo "MARKET_CRON_URL and CRON_SECRET are not set; skipping."; exit 0; fi
          curl --fail-with-body --silent --show-error --max-time 90 -H "Authorization: Bearer $SECRET" "$URL"
